name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build dist
        run: bun run build

      - name: Smoke test built CLI under Bun
        run: |
          export TWOWEEKS_HOME=/tmp/tw-smoke-$$
          bun ./dist/cli.js --version
          # Manual flow: explicit ETA (required since v0.5.0)
          bun ./dist/cli.js "smoke test" "2 weeks"
          bun ./dist/cli.js ship --json > /tmp/ship.json
          cat /tmp/ship.json
          bun -e "JSON.parse(require('fs').readFileSync('/tmp/ship.json', 'utf-8'))"
          # Auto-capture flow: estimate read from piped text
          export TWOWEEKS_HOME=/tmp/tw-smoke-watch-$$
          echo "Sure, this should take about 2 weeks of focused work." | bun ./dist/cli.js watch --json > /tmp/watch.json
          cat /tmp/watch.json
          bun -e "const r = JSON.parse(require('fs').readFileSync('/tmp/watch.json', 'utf-8')); if (!r.ok || r.session.eta_text !== '2 weeks') { console.error('auto-capture did not produce expected session'); process.exit(1) }"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke test built CLI under Node
        run: |
          export TWOWEEKS_HOME=/tmp/tw-smoke-node-$$
          node ./dist/cli.js --version
          node ./dist/cli.js "smoke test" "2 weeks"
          node ./dist/cli.js ship --json | tee /tmp/ship.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/ship.json', 'utf-8'))"
          export TWOWEEKS_HOME=/tmp/tw-smoke-node-watch-$$
          echo "Sure, this should take about 2 weeks of focused work." | node ./dist/cli.js watch --json > /tmp/watch.json
          cat /tmp/watch.json
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/watch.json', 'utf-8')); if (!r.ok || r.session.eta_text !== '2 weeks') { console.error('auto-capture did not produce expected session'); process.exit(1) }"
